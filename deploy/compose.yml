# barber-saas-infra-postgres includes this file. The workflow schema is versioned here, not in a -db
# repository (ADR-009): this runner applies it to the single PostgreSQL instance of
# barber-saas-infra-postgres with its own changelog tables (Annex J J.6). It starts only on demand:
#   docker compose --env-file env/dev.env run --rm workflow-db-migrate     (from barber-saas-infra-postgres)
# This file also defines the workflow service itself; barber-saas-infra-postgres includes it to compose the platform.
services:
  workflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      # The workflow schema of the single instance, with its own user (ADR-009, Annex J J.7).
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      DATABASE_USER: workflow_app
      DATABASE_PASSWORD: ${WORKFLOW_APP_PASSWORD:?set WORKFLOW_APP_PASSWORD}
      # Every service validates tokens itself with the public key (norm 5.3.7).
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run barber-saas-infra-postgres/scripts/dev-keys.sh}
      # Its own service token, sub barber-saas-workflow (07-api/authentication.md).
      SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:?run barber-saas-infra-postgres/scripts/dev-keys.sh}
      BARBERSHOP_API_URL: http://barbershop-api:8080
      PLATFORM_ADMIN_API_URL: http://platform-admin-api:8080
      IDENTITY_AUTH_API_URL: http://identity-auth-api:8080
      DB_POOL_MAX: "5"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && grep -q ok <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8080"]
    networks: [platform]

  workflow-db-migrate:
    image: liquibase/liquibase:4.29
    profiles: [tooling]
    volumes:
      - ../db:/workspace:ro
    entrypoint: ["liquibase",
      "--search-path=/workspace",
      "--changelog-file=changelog-master.yaml",
      "--url=jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}",
      "--username=${PG_ADMIN_USER:?set PG_ADMIN_USER}",
      "--password=${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD}",
      "--database-changelog-table-name=databasechangelog_workflow",
      "--database-changelog-lock-table-name=databasechangeloglock_workflow"]
    command: ["update"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
