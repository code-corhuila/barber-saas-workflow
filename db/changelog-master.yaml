databaseChangeLog:
  - changeSet:
      id: ddl-schema-001
      author: Pipecerquera
      labels: "HU-AUTH-003"
      comment: "The workflow schema, in the single instance (ADR-009). Nothing lives in public (Annex J J.4)."
      changes:
        - sqlFile:
            path: 001_create_schema_workflow.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
